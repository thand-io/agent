{{define "header"}}
{{template "head" .}}
<body>
    {{if .User}}
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('userDropdown', () => ({
                open: false,
                sessions: [],
                defaultProvider: '',
                
                async fetchSessions() {
                    try {
                        const response = await fetch('{{.Config.ApiBasePath}}/sessions', {
                            credentials: 'include'
                        });
                        if (response.ok) {
                            const data = await response.json();
                            this.defaultProvider = data.defaultProvider || '';
                            this.sessions = Object.entries(data.sessions || {}).map(([name, session]) => ({
                                name,
                                expiry: session.expiry,
                                expired: new Date(session.expiry) < new Date()
                            }));
                        }
                    } catch (error) {
                        console.error('Failed to fetch sessions:', error);
                    }
                },
                
                async setDefaultSession(sessionName) {
                    try {
                        const response = await fetch('{{.Config.ApiBasePath}}/sessions', {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ provider: sessionName }),
                            credentials: 'include'
                        });
                        
                        if (response.ok) {
                            window.location.reload();
                        } else {
                            console.error('Failed to update default session');
                        }
                    } catch (error) {
                        console.error('Error updating default session:', error);
                    }
                },
                
                get hasActiveSessions() {
                    return this.sessions.filter(session => !session.expired).length > 0;
                },
                
                get hasMultipleSessions() {
                    return this.sessions.length >= 2;
                },
                
                get statusClass() {
                    return this.hasActiveSessions ? 'status-active' : 'status-inactive';
                },
                
                get statusTitle() {
                    return this.hasActiveSessions 
                        ? `${this.sessions.length} active session${this.sessions.length > 1 ? 's' : ''}`
                        : 'No active sessions';
                },
                
                formatExpiry(expiry, expired) {
                    return expired ? 'Expired' : 'Expires ' + new Date(expiry).toLocaleString();
                },
                
                getSessionStatusClass(expired) {
                    return expired ? 'error' : 'healthy';
                },
                
                isDefaultSession(sessionName) {
                    return this.defaultProvider === sessionName;
                },
                
                handleButtonClick() {
                    if (this.hasMultipleSessions) {
                        this.open = !this.open;
                    } else {
                        window.location.href = '/user';
                    }
                },
                
                async selectSession(sessionName) {
                    console.log('Selected session:', sessionName);
                    await this.setDefaultSession(sessionName);
                    this.open = false;
                },
                
                async logout() {
                    try {
                        const response = await fetch('{{.Config.ApiBasePath}}/sessions', {
                            method: 'DELETE',
                            credentials: 'include'
                        });
                        
                        if (response.ok) {
                            window.location.reload();
                        } else {
                            console.error('Failed to logout');
                        }
                    } catch (error) {
                        console.error('Error during logout:', error);
                    }
                },
                
                init() {
                    this.fetchSessions();
                    setInterval(() => this.fetchSessions(), 60000);
                }
            }));
        });
    </script>
    {{end}}
    
    <header>
        <nav class="container">
            <div class="nav-left">
                <div class="logo">
                    <a href="/">
                        {{.ServiceName}}
                    </a>
                </div>
                <ul class="nav-links-left">
                    <li class="nav-divider"></li>
                    <li><a href="/roles">Roles</a></li>
                    <li><a href="/workflows">Workflows</a></li>
                    <li><a href="/providers">Providers</a></li>
                    <li><a href="/executions">Executions</a></li>
                    <li class="nav-divider"></li>
                    <li><a href="/elevate" class="nav-button primary">Request Elevation</a></li>
                </ul>
            </div>
            <div class="nav-right">
                {{if .User}}
                    <div class="user-dropdown" x-data="userDropdown" @click.away="open = false">
                        <button class="nav-button user-button" 
                                :class="statusClass"
                                @click.prevent="handleButtonClick()">
                            <span class="status-indicator" 
                                  :class="statusClass"
                                  :title="statusTitle"></span>
                            <span>{{.User.GetName}}</span>
                            <span class="dropdown-arrow" 
                                  x-show="hasMultipleSessions">▼</span>
                        </button>
                        <div class="dropdown-menu" 
                             :class="{ 'show': open }">
                            <a href="/auth" class="dropdown-item">Authenticate</a>
                            <a href="/user" class="dropdown-item">Profile</a>
                            <button class="dropdown-item" @click="logout()">Logout all</button>
                            <div class="dropdown-divider"></div>
                            <template x-for="session in sessions" :key="session.name">
                                <button class="dropdown-item session-item"
                                        :class="{ 'expired': session.expired, 'default-session': isDefaultSession(session.name) }"
                                        @click="selectSession(session.name)">
                                    <div class="session-info">
                                        <div class="status-dot" :class="getSessionStatusClass(session.expired)"></div>
                                        <div class="session-details">
                                            <div class="session-name">
                                                <span x-text="session.name"></span>
                                                <span x-show="isDefaultSession(session.name)" class="default-badge">Default</span>
                                            </div>
                                            <div class="session-expiry" x-text="formatExpiry(session.expiry, session.expired)"></div>
                                        </div>
                                    </div>
                                </button>
                            </template>
                        </div>
                    </div>
                {{else}}
                    <a href="/auth" class="nav-button">Login</a>
                {{end}}
            </div>
        </nav>
    </header>
{{end}}
