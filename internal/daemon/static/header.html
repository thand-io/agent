{{define "header"}}
{{template "head" .}}
<body>
    {{if .User}}
    <script>
        // Initialize global auth store with server-side data
        document.addEventListener('alpine:init', () => {
            // Fetch sessions data on initial load
            fetch('{{.Config.ApiBasePath}}/sessions', {
                credentials: 'include'
            })
            .then(response => response.json())
            .then(data => {
                Alpine.store('auth').init(
                    {
                        name: '{{.User.GetName}}',
                        email: '{{.User.Email}}'
                    },
                    data,
                    '{{.Config.ApiBasePath}}'
                );
            })
            .catch(error => {
                console.error('Failed to fetch sessions:', error);
                // Initialize with user data only
                Alpine.store('auth').init(
                    {
                        name: '{{.User.GetName}}',
                        email: '{{.User.Email}}'
                    },
                    null,
                    '{{.Config.ApiBasePath}}'
                );
            });
        });
    </script>
    {{else}}
    <script>
        // Initialize store without user data for logged-out state
        document.addEventListener('alpine:init', () => {
            Alpine.store('auth').init(null, null, '{{.Config.ApiBasePath}}');
        });
    </script>
    {{end}}
    
    <header>
        <nav class="container">
            <div class="nav-left">
                <div class="logo">
                    <a href="/">
                        {{.ServiceName}}
                    </a>
                </div>
                <ul class="nav-links-left">
                    <li class="nav-divider"></li>
                    <li><a href="/roles">Roles</a></li>
                    <li><a href="/workflows">Workflows</a></li>
                    <li><a href="/providers">Providers</a></li>
                    <li><a href="/executions">Executions</a></li>
                    <li class="nav-divider"></li>
                    <li><a href="/elevate" class="nav-button primary">Request Elevation</a></li>
                </ul>
            </div>
            <div class="nav-right">
                {{if .User}}
                    <div class="user-dropdown" x-data="{ open: false }" @click.away="open = false">
                        <button class="nav-button user-button" 
                                :class="$store.auth.statusClass"
                                @click.prevent="$store.auth.hasMultipleSessions ? open = !open : window.location.href = '/user'">
                            <span class="status-indicator" 
                                  :class="$store.auth.statusClass"
                                  :title="$store.auth.statusTitle"></span>
                            <span x-text="$store.auth.user?.name || '{{.User.GetName}}'"></span>
                            <span class="dropdown-arrow" 
                                  x-show="$store.auth.hasMultipleSessions">▼</span>
                        </button>
                        <div class="dropdown-menu" 
                             :class="{ 'show': open }">
                            <a href="/auth" class="dropdown-item">Authenticate</a>
                            <a href="/user" class="dropdown-item">Profile</a>
                            <button class="dropdown-item" @click="$store.auth.logout()">Logout all</button>
                            <div class="dropdown-divider"></div>
                            <template x-for="session in $store.auth.sessions" :key="session.name">
                                <button class="dropdown-item session-item"
                                        :class="{ 'expired': session.expired, 'default-session': $store.auth.isDefaultSession(session.name) }"
                                        @click="$store.auth.setDefaultSession(session.name); open = false">
                                    <div class="session-info">
                                        <div class="status-dot" :class="$store.auth.getSessionStatusClass(session.expired)"></div>
                                        <div class="session-details">
                                            <div class="session-name">
                                                <span x-text="session.name"></span>
                                                <span x-show="$store.auth.isDefaultSession(session.name)" class="default-badge">Default</span>
                                            </div>
                                            <div class="session-expiry" x-text="$store.auth.formatExpiry(session.expiry, session.expired)"></div>
                                        </div>
                                    </div>
                                </button>
                            </template>
                        </div>
                    </div>
                {{else}}
                    <a href="/auth" class="nav-button">Login</a>
                {{end}}
            </div>
        </nav>
    </header>
{{end}}
