version: "1.0"
providers:

  thand:
    name: Thand Provider
    description: Thand internal provider
    provider: thand
    enabled: true

  local-elevation:
    name: Local Elevation
    description: Local privilege elevation (like sudo or UAC)
    provider: local
    enabled: true

  local-presence:
    name: Local Presence
    description: Local macOS device-owner approval prompts
    provider: local-presence
    enabled: true
