version: "1.0"
roles:
  # Read-Only Access
  aws-readonly:
    name: AWS Read-Only
    description: Read-only access to AWS resources across all services
    workflows: 
      - aws-simple-elevation
    inherits:
      - arn:aws:iam::aws:policy/ReadOnlyAccess
    permissions:
      allow:
        - ec2:Describe*
        - s3:Get*
        - s3:List*
        - rds:Describe*
        - lambda:Get*
        - lambda:List*
        - cloudwatch:Describe*
        - cloudwatch:Get*
        - cloudwatch:List*
    providers:
      - aws
    enabled: true

  # Administrator Access
  aws-admin:
    name: AWS Administrator
    description: Full administrative access to all AWS resources
    workflows: 
      - aws-email-approval
    inherits:
      - arn:aws:iam::aws:policy/AdministratorAccess
    permissions:
      allow:
        - "*:*"
    providers:
      - aws
    enabled: true

  # Secrets Manager Access
  aws-secrets-manager:
    name: AWS Secrets Manager
    description: Full access to AWS Secrets Manager for managing secrets
    workflows:
      - aws-email-approval
    inherits:
      - arn:aws:iam::aws:policy/SecretsManagerReadWrite
    permissions:
      allow:
        - secretsmanager:*
        - kms:Decrypt
        - kms:Encrypt
        - kms:DescribeKey
    providers:
      - aws
    enabled: true

  # Database Administrator
  aws-database-admin:
    name: AWS Database Administrator
    description: Full access to RDS, DynamoDB, and database services
    workflows:
      - aws-email-approval
    inherits:
      - arn:aws:iam::aws:policy/AmazonRDSFullAccess
      - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
    permissions:
      allow:
        - rds:*
        - dynamodb:*
        - elasticache:*
        - redshift:*
    providers:
      - aws
    enabled: true

  # Storage Administrator
  aws-storage-admin:
    name: AWS Storage Administrator
    description: Full access to S3, EFS, and storage services
    workflows:
      - aws-email-approval
    inherits:
      - arn:aws:iam::aws:policy/AmazonS3FullAccess
      - arn:aws:iam::aws:policy/AmazonElasticFileSystemFullAccess
    permissions:
      allow:
        - s3:*
        - efs:*
        - fsx:*
        - backup:*
    providers:
      - aws
    enabled: true

  # Network Administrator
  aws-network-admin:
    name: AWS Network Administrator
    description: Full access to VPC, networking, and connectivity services
    workflows:
      - aws-email-approval
    inherits:
      - arn:aws:iam::aws:policy/job-function/NetworkAdministrator
    permissions:
      allow:
        - ec2:*Vpc*
        - ec2:*Subnet*
        - ec2:*Gateway*
        - ec2:*Route*
        - ec2:*NetworkAcl*
        - ec2:*SecurityGroup*
        - route53:*
        - elasticloadbalancing:*
    providers:
      - aws
    enabled: true

  # Security Auditor
  aws-security-auditor:
    name: AWS Security Auditor
    description: Read access to security-related services and audit logs
    workflows:
      - aws-simple-elevation
    inherits:
      - arn:aws:iam::aws:policy/SecurityAudit
    permissions:
      allow:
        - iam:Get*
        - iam:List*
        - cloudtrail:*
        - guardduty:Get*
        - guardduty:List*
        - securityhub:Get*
        - config:Describe*
    providers:
      - aws
    enabled: true

  # Compute Administrator
  aws-compute-admin:
    name: AWS Compute Administrator
    description: Full access to EC2, Lambda, ECS, and compute services
    workflows:
      - aws-email-approval
    inherits:
      - arn:aws:iam::aws:policy/AmazonEC2FullAccess
      - arn:aws:iam::aws:policy/AWSLambda_FullAccess
    permissions:
      allow:
        - ec2:*
        - lambda:*
        - ecs:*
        - eks:*
        - ecr:*
        - autoscaling:*
    providers:
      - aws
    enabled: true

  # Developer Access
  aws-developer:
    name: AWS Developer
    description: Developer access with limited permissions
    workflows:
      - aws-simple-elevation
    inherits:
      - arn:aws:iam::aws:policy/PowerUserAccess
    permissions:
      allow:
        - ec2:*
        - s3:*
        - lambda:*
        - dynamodb:*
        - sqs:*
        - sns:*
        - cloudwatch:*
        - logs:*
      deny:
        - iam:*
        - organizations:*
    providers:
      - aws
    enabled: true

