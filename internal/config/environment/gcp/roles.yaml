version: "1.0"
roles:
  # Viewer Access
  gcp-viewer:
    name: GCP Viewer
    description: Read-only access to all GCP resources
    workflows: 
      - gcp-simple-elevation
    inherits:
      - roles/viewer
    providers:
      - gcp
    enabled: true

  # Administrator Access
  gcp-admin:
    name: GCP Administrator
    description: Full administrative access to all GCP resources
    workflows: 
      - gcp-simple-elevation
    inherits:
      - roles/owner
    providers:
      - gcp
    enabled: true

  # Secret Manager Access
  gcp-secret-manager:
    name: GCP Secret Manager Admin
    description: Full access to Secret Manager for managing secrets
    workflows:
      - gcp-simple-elevation
    inherits:
      - roles/secretmanager.admin
    providers:
      - gcp
    enabled: true

  # Database Administrator
  gcp-database-admin:
    name: GCP Database Administrator
    description: Full access to Cloud SQL, Spanner, and database services
    workflows:
      - gcp-simple-elevation
    inherits:
      - roles/cloudsql.admin
      - roles/spanner.admin
      - roles/datastore.owner
    providers:
      - gcp
    enabled: true

  # Storage Administrator
  gcp-storage-admin:
    name: GCP Storage Administrator
    description: Full access to Cloud Storage and storage services
    workflows:
      - gcp-email-approval
    inherits:
      - roles/storage.admin
    providers:
      - gcp
    enabled: true

  # Network Administrator
  gcp-network-admin:
    name: GCP Network Administrator
    description: Full access to VPC, networking, and connectivity services
    workflows:
      - gcp-email-approval
    inherits:
      - roles/compute.networkAdmin
    providers:
      - gcp
    enabled: true

  # Security Administrator
  gcp-security-admin:
    name: GCP Security Administrator
    description: Full access to security and IAM services
    workflows:
      - gcp-email-approval
    inherits:
      - roles/iam.securityAdmin
      - roles/securitycenter.admin
    providers:
      - gcp
    enabled: true

  # Compute Administrator
  gcp-compute-admin:
    name: GCP Compute Administrator
    description: Full access to Compute Engine, GKE, and compute services
    workflows:
      - gcp-email-approval
    inherits:
      - roles/compute.admin
      - roles/container.admin
    providers:
      - gcp
    enabled: true

  # Developer Access
  gcp-developer:
    name: GCP Developer
    description: Developer access with limited permissions
    workflows:
      - gcp-simple-elevation
    inherits:
      - roles/editor
    providers:
      - gcp
    enabled: true

  # Monitoring Administrator
  gcp-monitoring-admin:
    name: GCP Monitoring Administrator
    description: Full access to monitoring, logging, and observability
    workflows:
      - gcp-simple-elevation
    inherits:
      - roles/monitoring.admin
      - roles/logging.admin
    providers:
      - gcp
    enabled: true

