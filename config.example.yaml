# Thand Backend Configuration

# Environment Configuration
environment:
  # Supported platforms: gcp, aws, azure, local
  platform: "local"
  # Platform-specific config
  config:
    # Local environment does not require additional configuration
    # Add any local-specific settings here if needed
    salt: "changeme"
    password: "changeme"

# Services Configuration
# The services configuration inherits from environment configuration
services:
  temporal:
    # Connection settings
    # host: "temporal.example.com"
    # port: 7233
    # namespace: "default"

    # Authentication Option 1: API Key (Temporal Cloud)
    # api_key: "your-temporal-api-key"

    # Authentication Option 2: mTLS with CSP vault secret (combined cert+key)
    # Requires vault to be configured (AWS Secrets Manager, Azure Key Vault, GCP Secret Manager)
    # Secret should contain both certificate and private key in combined PEM format:
    #   -----BEGIN CERTIFICATE-----
    #   ...
    #   -----END CERTIFICATE-----
    #   -----BEGIN PRIVATE KEY-----
    #   ...
    #   -----END PRIVATE KEY-----
    # mtls_cert_key_secret: "temporal/mtls/client-cert"
    # mtls_ca_secret: "temporal/mtls/ca-cert"  # Optional: Custom CA for server verification

    # Authentication Option 2b: mTLS with HSM-backed key (MOST SECURE for production)
    # Private key is managed by CSP HSM and never leaves the hardware security module
    # Certificate is stored in vault, key operations are performed in HSM
    # AWS Example (KMS key ARN + Secrets Manager):
    # mtls_cert_secret: "temporal/mtls/client-cert"  # Secret containing only certificate
    # mtls_hsm_key_id: "arn:aws:kms:us-west-2:123456789012:key/abc123-..."  # AWS KMS key ARN
    # GCP Example (Cloud KMS resource name + Secret Manager):
    # mtls_cert_secret: "temporal-mtls-cert"
    # mtls_hsm_key_id: "projects/my-project/locations/us-west1/keyRings/thand/cryptoKeys/temporal-key"
    # Azure Example (Key Vault key URL + Key Vault secret):
    # mtls_cert_secret: "temporal-mtls-cert"
    # mtls_hsm_key_id: "https://my-keyvault.vault.azure.net/keys/temporal-key"
    # mtls_ca_secret: "temporal/mtls/ca-cert"  # Optional: Custom CA

    # Authentication Option 3: mTLS with file paths (Kubernetes mounted secrets)
    # mtls_cert_file: "/etc/temporal/certs/tls.crt"
    # mtls_key_file: "/etc/temporal/certs/tls.key"
    # mtls_ca_file: "/etc/temporal/certs/ca.crt"  # Optional: Custom CA

    # Authentication Option 4: mTLS with inline certificates (development/testing only)
    # mtls_cert: |
    #   -----BEGIN CERTIFICATE-----
    #   MIIDXTCCAkWgAwIBAgIJAKL0UG+mRhmfMA0GCSqGSIb3DQEBCwUAMEUxCzAJBgNV
    #   ...
    #   -----END CERTIFICATE-----
    # mtls_key: |
    #   -----BEGIN PRIVATE KEY-----
    #   MIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQDXhzR7NqPNa1PE
    #   ...
    #   -----END PRIVATE KEY-----
    # mtls_ca: |
    #   -----BEGIN CERTIFICATE-----
    #   ...
    #   -----END CERTIFICATE-----

# Server Configuration
server:
  host: "0.0.0.0"
  port: 5225
  
  limit:
    requests_per_minute: 100
    burst: 10
    read_timeout: 30s
    write_timeout: 30s
    idle_timeout: 120s
  
  security:
    cors:
      allowed_origins:
        - "https://*.app.thand.io"
      allowed_methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "OPTIONS"
      allowed_headers:
        - "Authorization"
        - "Content-Type"
        - "X-Requested-With"
      max_age: 86400

    # Metrics Configuration
    metrics:
      enabled: true
      path: "/metrics"
      namespace: "thand"

    # Health Check Configuration
    health:
      path: "/health"

# Logging Configuration
logging:
  level: "info" # debug, info, warn, error
  format: "json" # json, text
  output: "stdout" # stdout, stderr, file path

providers:
  # Define your providers here
  # url: "https://api.example.com/providers.yaml"
  # path: ./path/to/providers
  
  # Or define inline providers
  # provider1:
  #   type: "type1"
  #   enabled: true

roles:
  # Define your roles here

workflows:
  # Define your workflows here
