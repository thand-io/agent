version: "1.0"
providers:
  # AWS provider configured for LocalStack
  aws-localstack:
    name: AWS LocalStack Test
    description: AWS provider pointing to LocalStack for testing
    provider: aws
    enabled: true
    config:
      region: us-east-1
      endpoint: "${LOCALSTACK_ENDPOINT}"
      access_key_id: test
      secret_access_key: test
      account_id: "000000000000"
      imds_disable: true
      iam_mode: traditional

  # Email provider configured for MailHog
  email-test:
    name: MailHog Test Email
    description: Email provider pointing to MailHog for testing
    provider: email
    enabled: true
    config:
      platform: smtp
      host: "${MAILHOG_HOST}"
      port: "${MAILHOG_PORT}"
      from: test@thand.io
      user: ""
      pass: ""

  # OAuth2 provider for authentication via Keycloak (OIDC)
  oidc-test:
    name: Keycloak OIDC Provider
    description: OAuth2 provider backed by Keycloak for e2e testing
    provider: oauth2
    enabled: true
    config:
      client_id: thand-oidc
      client_secret: thand-oidc-secret
      auth_url: "${OIDC_ISSUER_URL}/protocol/openid-connect/auth"
      token_url: "${OIDC_ISSUER_URL}/protocol/openid-connect/token"
      scopes:
        - openid
        - profile
        - email
      redirect_url: "${THAND_SERVER_URL}/api/v1/auth/callback/oidc-test"
