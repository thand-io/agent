version: "1.0"
providers:
  # AWS provider configured for LocalStack
  aws-localstack:
    name: AWS LocalStack Test
    description: AWS provider pointing to LocalStack for testing
    provider: aws
    enabled: true
    config:
      region: us-east-1
      endpoint: "${LOCALSTACK_ENDPOINT}"
      access_key_id: test
      secret_access_key: test
      account_id: "000000000000"
      imds_disable: true
      iam_mode: traditional

  # Email provider configured for MailHog
  email-test:
    name: MailHog Test Email
    description: Email provider pointing to MailHog for testing
    provider: email
    enabled: true
    config:
      platform: smtp
      host: "${MAILHOG_HOST}"
      port: "${MAILHOG_PORT}"
      from: test@thand.io
      user: ""
      pass: ""

  # SAML provider for authentication via Keycloak
  saml-test:
    name: Keycloak SAML Provider
    description: SAML provider backed by Keycloak for e2e testing
    provider: saml
    enabled: true
    config:
      idp_metadata_url: "${SAML_IDP_METADATA_URL_INTERNAL}"
      entity_id: "${THAND_SERVER_URL}"
      root_url: "${THAND_SERVER_URL}"
      sign_requests: false
