version: "1.0"
workflows:
  # AWS elevation workflow with multiple approvals
  aws_multi_approval:
    description: AWS access elevation with multiple approvals
    authentication: default
    enabled: true
    workflow:
      document:
        dsl: "1.0.0-alpha5"
        namespace: "thand-test"
        name: "aws-multi-approval"
        version: "1.0.0"
      do:
        - validate:
            thand: validate
            with:
              validator: static
            then: approvals
        - approvals:
            thand: approvals
            on:
              approved: authorize
              denied: denied
            with:
              approvals: 2
              selfApprove: false
              notifiers:
                email:
                  provider: email-test
                  to: testuser@thand.io
                  message: "User is requesting AWS admin access. Please approve."
            then: denied
        - authorize:
            thand: authorize
            with:
              revocation: revoke
            then: monitor
        - monitor:
            thand: monitor
            then: revoke
        - revoke:
            thand: revoke
            then: end
        - denied:
            thand: notify
            with:
              notifiers:
                email:
                  provider: email-test
